<div class="inline-flex items-center gap-2">
  <span class="hidden text-label-sm text-text-secondary sm:inline" id="theme-switch-label">
    Modo oscuro
  </span>
  <button
    aria-labelledby="theme-switch-label"
    class="relative inline-flex h-7 w-12 shrink-0 cursor-pointer items-center rounded-full border border-border p-0.5 transition-colors hover:border-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus/30"
    [class.bg-primary]="theme.isDarkMode()"
    [class.bg-surface-muted]="!theme.isDarkMode()"
    [attr.aria-checked]="theme.isDarkMode()"
    [attr.title]="theme.isDarkMode() ? 'Desactivar modo oscuro' : 'Activar modo oscuro'"
    role="switch"
    type="button"
    (click)="theme.toggle()"
  >
    <span
      aria-hidden="true"
      class="pointer-events-none flex h-5 w-5 items-center justify-center rounded-full bg-surface text-primary shadow-panel transition-transform"
      [class.translate-x-5]="theme.isDarkMode()"
    >
      @if (theme.isDarkMode()) {
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
        </svg>
      } @else {
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" />
        </svg>
      }
    </span>
  </button>
</div>
